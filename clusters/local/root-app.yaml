apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-cluster
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/emondarock/gitops-platform.git
    targetRevision: main
    path: clusters/local/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
