apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tenant-a-availability-slo
  namespace: platform
spec:
  groups:
    - name: tenant-a.slo.availability
      rules:
        - alert: TenantAAvailabilityFastBurn
          expr: |
            (
              1 - (
                sum(rate(kube_pod_status_ready{namespace="tenant-a",condition="true"}[5m]))
                /
                sum(rate(kube_pod_status_ready{namespace="tenant-a"}[5m]))
              )
            ) > (14.4 * 0.001)
          for: 5m
          labels:
            severity: critical
            tenant: tenant-a
          annotations:
            summary: "Tenant A availability SLO fast burn"
            description: "Tenant A is burning error budget too fast (5m window)."

        - alert: TenantAAvailabilitySlowBurn
          expr: |
            (
              1 - (
                sum(rate(kube_pod_status_ready{namespace="tenant-a",condition="true"}[30m]))
                /
                sum(rate(kube_pod_status_ready{namespace="tenant-a"}[30m]))
              )
            ) > (6 * 0.001)
          for: 30m
          labels:
            severity: warning
            tenant: tenant-a
          annotations:
            summary: "Tenant A availability SLO slow burn"
            description: "Tenant A is steadily burning error budget (30m window)."
